name: Build_imm_高通_8916

on:
  # 不再定时触发，只能手动或通过 API 触发
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source:
        description: ' ← 选择源码：分支（跟随上游更新）或稳定版 tag（v 开头，出正式版号）'
        required: true
        default: openwrt-25.12
        type: choice
        options:
          - openwrt-25.12
          - openwrt-24.10
          - master
          - v25.12.2
          - v25.12.1
          - v25.12.0
          - v24.10.6
          - v24.10.5
      device:
        description: ' ← 选择要编译的机型'
        required: true
        default: all
        type: choice
        options:
          - all
          - jz02v10
          - ufi001c
          - ufi001b
          - ufi103s
          - qrzl903
          - w001
          - ufi003
          - uz801
          - mf32
          - mf601
          - wf2
          - sp970v11
          - sp970v10
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean
      log_switch:
        description: " ← 单线程编译 默认4线程"
        required: false
        default: false
        type: boolean


env:
  ALL_DEVICES: "jz02v10 ufi001c ufi001b ufi103s qrzl903 w001 ufi003 uz801 mf32 mf601 wf2 sp970v11 sp970v10"
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  # 实际用的分支/tag 由下面的「选择并校验源码」步骤决定（可被 workflow_dispatch 覆盖）
  REPO_BRANCH: master
  # 缓存用的分支名：tag 会映射成对应分支（v25.12.2 -> openwrt-25.12），让 tag 和分支共用 ccache/dl 缓存
  CACHE_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  # 先算出这次要编哪些机型，结果喂给 build 的 matrix（matrix 不能直接读 inputs）
  setup:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.gen.outputs.devices }}
      list: ${{ steps.gen.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: 解析要编译的机型
        id: gen
        run: |
          # 只有下拉：all = 全部 13 个机型，否则编选中的那个
          SEL="${{ inputs.device }}"
          [ -n "$SEL" ] || SEL="all"

          if [ "$SEL" = "all" ]; then
            LIST="$ALL_DEVICES"
            echo "选择: 全部机型"
          else
            LIST="$SEL"
            echo "选择: $SEL"
          fi

          OUT=""
          for d in $LIST; do
            if [ ! -f "config/$d.config" ]; then
              echo "::error::没有 config/$d.config，可选机型如下："
              ls config/*.config | sed 's#config/##; s#\.config##; s#^#  - #'
              exit 1
            fi
            case " $OUT " in *" $d "*) continue ;; esac
            OUT="$OUT $d"
          done
          OUT="${OUT# }"
          if [ -z "$OUT" ]; then
            echo "::error::没有解析出任何机型"
            exit 1
          fi

          COUNT=$(echo "$OUT" | wc -w)
          JSON=$(printf '%s\n' $OUT | sed 's/^/"/; s/$/"/' | tr '\n' ',')
          JSON="${JSON%,}"
          echo "list=$OUT" >> "$GITHUB_OUTPUT"
          echo "devices=[$JSON]" >> "$GITHUB_OUTPUT"
          echo "✓ 本次编译 $COUNT 个机型: $OUT"

  build:
    needs: setup
    runs-on: ubuntu-24.04
    # 正常一次全量编译 1.5~2 小时；给个上限，免得 runner 卡死时白占 6 小时（GitHub 默认上限）
    timeout-minutes: 300
    permissions:
       contents: write
       
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.setup.outputs.devices) }}
    steps:
   
    - name: Checkout
      uses: actions/checkout@main
      
    - name: 记录当前编译型号
      run: |
        echo "CONFIG_FILE=config/${{ matrix.device }}.config" >> $GITHUB_ENV

    - name: 选择并校验源码
      run: |
        # 一个下拉同时管分支和稳定版 tag；定时触发时无 inputs，回落到 master
        BR="${{ inputs.source }}"
        [ -n "$BR" ] || BR="master"

        echo "immortalwrt 仓库: $REPO_URL"
        echo "选用的源码: $BR"
        if ! git ls-remote --exit-code --heads "$REPO_URL" "$BR" >/dev/null 2>&1 \
           && ! git ls-remote --exit-code --tags "$REPO_URL" "$BR" >/dev/null 2>&1; then
          echo "::error::immortalwrt 仓库里没有分支或 tag「$BR」。可选项如下："
          echo "--- 分支 ---"
          git ls-remote --heads "$REPO_URL" | sed 's#^.*refs/heads/#  - #' | sort -u
          echo "--- 稳定版 tag（最近 10 个）---"
          git ls-remote --tags "$REPO_URL" | sed 's#^.*refs/tags/##; s#\^{}$##' | sort -V -u | tail -10 | sed 's#^#  - #'
          exit 1
        fi

        # tag 映射成分支名，让 tag 构建复用分支的 ccache/dl 缓存
        CACHE="$BR"
        case "$BR" in
        v[0-9]*)
          _ver=$(printf '%s' "$BR" | sed -E 's/^v([0-9]+\.[0-9]+).*/\1/')
          [ -n "$_ver" ] && CACHE="openwrt-$_ver"
          ;;
        esac

        echo "REPO_BRANCH=$BR" >> "$GITHUB_ENV"
        echo "CACHE_BRANCH=$CACHE" >> "$GITHUB_ENV"
        echo "✓ 将使用 immortalwrt@$BR（缓存按 $CACHE 复用）"


    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh
  
    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1.1.2
      with:
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false
        docker-images: false
        tools-cache: true
        
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update && sudo -E apt-get -y install --no-install-recommends $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)

    - name: Cache mkbootimg deb
      uses: actions/cache@v5
      with:
        path: downloads/mkbootimg_34.0.5-12build1_all.deb
        key: mkbootimg-34.0.5-12build1
        restore-keys: |
          mkbootimg-

    - name: mkbootimg build
      run: |
        mkdir -p downloads
        cd downloads

        if [ ! -f mkbootimg_34.0.5-12build1_all.deb ]; then
          echo "📥 mkbootimg deb not cached, downloading..."
          wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        else
          echo "✅ mkbootimg deb restored from cache"
        fi

        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb || true
        sudo apt-get install -f -y

        mkbootimg --help || true

        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
          echo "✅ mkbootimg found at: $MKBOOTIMG_PATH"
          file "$MKBOOTIMG_PATH"
        else
          echo "❌ mkbootimg not found in PATH!"
        fi

        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT


        
    - name: Ensure Python build tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install Unidecode



    - name: Clone source code
      working-directory: /mnt
      run: |
        df -hT $PWD
        echo "克隆 $REPO_URL 分支 $REPO_BRANCH"
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt
        echo "HEAD: $(git -C /mnt/openwrt rev-parse --short HEAD) ($(git -C /mnt/openwrt log -1 --format=%cd --date=short))"
        echo "===== 源码最近更新 (最后 10 条) ====="
        git -C /mnt/openwrt log -10 --oneline --no-merges

    # 必须在 DIY_P1 之前：DIY_P1 会把 msm89xx target 的 target/linux/generic/kernel-7.3 拷进来，
    # 之后就分不清哪些内核是分支原生的、哪些是 target 自带的。
    # 不再提供手动内核选项：永远用分支/tag 自带的内核（master=6.18、25.12=6.12、24.10=6.6）。
    - name: 解析内核版本（用源码自带）
      id: kver
      working-directory: /mnt/openwrt
      run: |
        TARGET_MK="$GITHUB_WORKSPACE/scripts/msm89xx/target/linux/msm89xx/Makefile"
        TARGET_KP=$(sed -n 's/^KERNEL_PATCHVER:= *//p' "$TARGET_MK")
        echo "msm89xx target 默认要求: ${TARGET_KP:-unknown}"

        AVAIL=$(ls target/linux/generic/kernel-* 2>/dev/null \
                  | sed 's#.*/kernel-##' | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tr '\n' ' ')
        echo "源码 $REPO_BRANCH 自带的内核: ${AVAIL:-（无）}"

        PICK=""
        case " $AVAIL " in *" $TARGET_KP "*) PICK="$TARGET_KP" ;; esac
        if [ -n "$PICK" ]; then
          echo "→ 源码支持 target 要求的 $PICK，直接用它"
        else
          PICK=$(echo $AVAIL | tr ' ' '\n' | tail -1)
          if [ -n "$PICK" ]; then
            echo "→ 源码没有 $TARGET_KP，改用自带的最新内核: $PICK"
          else
            PICK="$TARGET_KP"
            echo "→ 源码里没找到任何 kernel-* 元数据，回落 target 默认: $PICK"
          fi
        fi

        echo "KERNEL_PATCHVER=$PICK" >> "$GITHUB_ENV"
        echo "KERNEL_PATCHVER=$PICK" >> "$GITHUB_OUTPUT"
        echo "✓ 本次编译使用内核 $PICK"

    - name: Load custom DIY_P1_SH
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    # 必须放在 DIY_P1 之后：msm89xx target 会把自己的 target/linux/generic/kernel-<ver> 拷进来，
    # 内核版本元数据在 target/linux/generic/kernel-<ver>（新版）或 include/kernel-<ver>（旧版）
    - name: 检查内核版本可用性
      working-directory: /mnt/openwrt
      run: |
        KP="${KERNEL_PATCHVER:-$(sed -n 's/^KERNEL_PATCHVER:= *//p' target/linux/msm89xx/Makefile)}"
        echo "KERNEL_PATCHVER=$KP"
        echo "代码树里可用的内核元数据："
        { ls include/kernel-* target/linux/generic/kernel-* 2>/dev/null || true; } \
          | grep -E 'kernel-[0-9]' | sed 's#.*/##; s/^/  - /' | sort -u
        if [ -e "target/linux/generic/kernel-$KP" ] || [ -e "include/kernel-$KP" ]; then
          echo "✅ 内核 $KP 的版本/哈希文件存在"
        else
          echo "::error::找不到 kernel-$KP 的版本/哈希文件，make 阶段会报 Missing kernel version。"
          echo "::error::请在上面的 kernel 输入框里填上面列出的某个版本后重跑。"
          exit 1
        fi

     
    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        
        echo "📌 Local packages feed:"
        git -C feeds/packages log -1 --format="%H %ci %s"

        echo "📌 Actual remote of feeds/packages:"
        git -C feeds/packages remote get-url origin

        echo "📌 Remote HEAD actually used:"
        git -C feeds/packages ls-remote origin HEAD || true

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a -f
        
    - name: remove warning
      run: |
        chmod 755 $GITHUB_WORKSPACE/scripts/diy-part.sh
        $GITHUB_WORKSPACE/scripts/diy-part.sh

    - name: Load custom DIY_P2_SH
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        
        
    - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
      uses: WarpBuilds/action-debugger@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}
      
      
    - name: make defconfig
      run: |
        cd openwrt
        make defconfig V=s
        
    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: /mnt/openwrt/.ccache
        key: ccache-msm8916-${{ env.CACHE_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ccache-msm8916-${{ env.CACHE_BRANCH }}-
          ccache-msm8916-

    - name: Setup ccache
      run: |
       mkdir -p /mnt/openwrt/.ccache
       export CCACHE_DIR=/mnt/openwrt/.ccache
       export CCACHE_BASEDIR=/mnt/openwrt
       export CCACHE_NOHASHDIR=true
       echo "CCACHE_DIR=/mnt/openwrt/.ccache" >> "$GITHUB_ENV"
       echo "CCACHE_BASEDIR=/mnt/openwrt" >> "$GITHUB_ENV"
       echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
       ccache -M 10G
       ccache -o compression=true
       ccache -o compression_level=1
       ccache -o inode_cache=false
       ccache -o compiler_check=content
       ccache -o sloppiness=file_stat_matches,include_file_ctime,include_file_mtime,time_macros,pch_defines
       ccache -p | grep -E "max_size|cache_dir"
 
             
    - name: 查看 openwrt 目录并校验配置
      run: |
        ls -la openwrt/ | head -30
        echo "--- openwrt/.config ---"
        ls -lh openwrt/.config
        echo "--- 目标 ---"
        grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)=' openwrt/.config || true
        if ! grep -q '^CONFIG_TARGET_msm89xx=y' openwrt/.config; then
          echo "::error::defconfig 之后 .config 里没有 CONFIG_TARGET_msm89xx=y，说明分支 $REPO_BRANCH 与 msm89xx target 不匹配（目标被裁掉了）。"
          echo "::error::请确认内核版本是否填对，或改用 master 分支重试。"
          exit 1
        fi
        echo "✅ .config 仍是 msm89xx 目标"

 
    - name: 自动上传最新源码生成.config编译配置
      uses: actions/upload-artifact@main
      with:
       name: build-config
       path: |
         ${{ github.workspace }}/openwrt/.config
         ${{ github.workspace }}/openwrt/feeds.conf.default
       include-hidden-files: true
       
    - name: Cache dl
      id: cache-dl
      uses: actions/cache@v5
      with:
        path: openwrt/dl
        key: dl-${{ runner.os }}-${{ env.CACHE_BRANCH }}-immortalwrt-${{ hashFiles('openwrt/feeds.conf.default') }}
        restore-keys: |
          dl-${{ runner.os }}-${{ env.CACHE_BRANCH }}-immortalwrt-
          dl-${{ runner.os }}-immortalwrt-
          dl-${{ runner.os }}-c1c7610cf12d51c4330c53e338ebd7f883d32b71
          key: dl-${{ runner.os }}-${{ steps.srcver.outputs.sha }}

    - name: Download package
      run: |
        cd openwrt
        [ "${{ steps.cache-dl.outputs.cache-hit }}" = "true" ] && echo "cache hit" || echo "cache miss"
        df -h . || true
        # 不再用 output=$(...) 全量捕获：包多时输出能到几十 MB，既占内存又把日志吞掉，
        # 一旦 runner 中途挂了什么线索都留不下。改成写文件 + 只打尾部。
        make download -j$(nproc) -k > /tmp/dl.log 2>&1 || echo "::warning::make download 有失败项（下面只展示尾部，完整日志见 /tmp/dl.log）"
        echo "===== download 日志尾部 ====="
        tail -40 /tmp/dl.log || true
        if grep -qiE "Hash verification failed|checksum mismatch" /tmp/dl.log; then
          echo "::warning::检测到校验失败的包："
          grep -iE "Hash verification failed|checksum mismatch" /tmp/dl.log | head -50
        fi
        df -h . || true
      shell: bash
      
      
    - name: 补丁应用预检
      run: |
         cd openwrt
         bash $GITHUB_WORKSPACE/check-patches.sh

    
    - name: make -j$(nproc)
      id: compile
      run: |
        cd openwrt
        
        echo "===== ccache BEFORE ====="
        ccache --show-stats
        
        echo -e "$(nproc) thread compile"

        set +e
        make -j$(nproc)
        BUILD_EXIT=$?
        set -e

        if [ $BUILD_EXIT -ne 0 ]; then
          echo "⚠️ 并行编译失败，切换到详细模式..."
          set +e
          make -j8 V=s
          VERBOSE_EXIT=$?
          set -e
          [ $VERBOSE_EXIT -ne 0 ] && exit $VERBOSE_EXIT
          echo "✅ 详细模式编译成功"
        else
          echo "✅ 并行编译成功"
        fi

        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
      shell: bash

    - name: df -hT
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ env.REPO_BRANCH }}_${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Prefix common
      if: steps.organize.outputs.status == 'success'
      run: |
        cd ${{ env.FIRMWARE }}

        if [ "${{ matrix.device }}" != "jz02v10" ]; then
          rm -f config.buildinfo \
                feeds.buildinfo \
                profiles.json \
                sha256sums \
                version.buildinfo
        fi
      shell: bash

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ env.REPO_BRANCH }}_${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        # 分支名进 tag 前把 / 换成 -
        BR_TAG="${REPO_BRANCH//\//-}"
        echo "release_tag=MSM8916-${BR_TAG}-$(date +%Y.%m.%d)-V${{ github.run_number }}" >> $GITHUB_OUTPUT
        echo "release_name=MSM8916-${BR_TAG}-$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT
        touch release.txt
        if [ "${UPLOAD_GOFILE}" = "true" ] && [ -n "${{ steps.gofile.outputs.url }}" ]; then
          echo "🔗 GoFile" >> release.txt
        fi
        echo "" >> release.txt
        {
        echo "## 高通8916系列 immortalwrt" >> release.txt
        echo "- 编译时间: $(date +"%Y%m%d %H:%M:%S")" >> release.txt
        echo "- 编译机型: ${{ needs.setup.outputs.list }}" >> release.txt
        echo "- 管理地址: 192.168.10.1"
        echo "- 默认用户: root"
        echo "- 默认密码: 空"
        echo "- 源码仓库: ${{ env.REPO_URL }}" >> release.txt
        echo "- 分支: ${{ env.REPO_BRANCH }}" >> release.txt
        echo "- 选用内核: ${{ steps.kver.outputs.KERNEL_PATCHVER }}" >> release.txt
        echo "- 内核版本: $(grep -h "kmod-usb-core" ${{ env.FIRMWARE }}/*.manifest 2>/dev/null | awk -F' - ' '{print $2}' | grep -oP '[0-9]+\.[0-9]+(\.[0-9]+)?([-~]?rc[0-9]+)?' | head -1)"
        echo ""
        echo "### 主要插件"
        echo "#### luci-app 系列"
        grep -h "luci-app-" ${{ env.FIRMWARE }}/*.manifest 2>/dev/null | awk -F':' '{print $NF}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -oP 'luci-app-[a-zA-Z0-9_-]+' | sort -u | sed 's/^/- /'
        } >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

 
    - name: Generate file list
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        find ${{ env.FIRMWARE }} -type f > file_list.txt
        echo "Collected files:"
        cat file_list.txt
        test -s file_list.txt || { echo "::error::No firmware files found"; exit 1; }



    - name: Upload firmware to release
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        name: ${{ steps.tag.outputs.release_name }}
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false


    - name: Delete old workflow runs via GitHub API
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 2
        KEEP_MINIMUM_RUNS: 2
      run: |
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((now - (.created_at | fromdateiso8601)) > ($cutoff | tonumber))
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [[ -z "$DEL_IDS" ]]; then
          echo "No old runs to delete."
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "Deleting run $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
        fi
        